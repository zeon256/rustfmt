name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and upload (e.g. v1.12.0)
        required: true
        type: string
  release:
    types: [published]

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

permissions: {}

concurrency:
  group: release-binaries-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-release:
    name: ${{ matrix.build }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        build: [linux-x86_64, macos-x86_64, windows-x86_64-gnu, windows-x86_64-msvc]
        include:
          - build: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - build: windows-x86_64-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
          - build: windows-x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > rustup-init.sh
          sh rustup-init.sh -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # The crate links rustc_private internals, so the build must run with the
      # toolchain pinned in rust-toolchain.toml (nightly + llvm-tools + rustc-dev).
      # rustup fetches it automatically on first cargo invocation.
      - name: Add mingw64 to path for x86_64-gnu
        run: echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
        if: matrix.build == 'windows-x86_64-gnu'

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Build archive
        run: |
          staging="rustfmt_${{ matrix.build }}_${{ env.RELEASE_TAG }}"
          mkdir -p "$staging"

          cp {README.md,Configurations.md,CHANGELOG.md,LICENSE-MIT,LICENSE-APACHE} "$staging/"

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/{rustfmt.exe,cargo-fmt.exe,rustfmt-format-diff.exe,git-rustfmt.exe} "$staging/"
            7z a "$staging.zip" "$staging"
            echo "ASSET=$staging.zip" >> $GITHUB_ENV
          else
            cp target/release/{rustfmt,cargo-fmt,rustfmt-format-diff,git-rustfmt} "$staging/"
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ env.RELEASE_TAG }}" "${{ env.ASSET }}" --clobber
